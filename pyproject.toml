[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swipeswitch"
version = "0.3.5"
description = "Touchpad-driven window and workspace navigation for X11 desktops"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
swipeswitch = "swipeswitch.__main__:main"

[tool.setuptools]
packages = [
    "swipeswitch",
    "swipeswitch.input",
    "swipeswitch.recognition",
    "swipeswitch.desktop",
    "swipeswitch.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
